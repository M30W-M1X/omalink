name: omalink
description: OmaLink — Android Continuity, Remote Desktop, OS Control & AI Agent companion for Omarchy Linux.
publish_to: 'none'
version: 3.7.0+20

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^18.0.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
