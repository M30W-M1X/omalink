name: Build & Test OmaLink

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge-tests:
    name: Omarchy Bridge Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bridge unit and integration tests
        run: PYTHONPATH=bridge python3 -m unittest discover -s bridge -v

  android-build:
    name: Flutter Test & Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: android_app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: android_app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: android_app
        run: flutter test

      - name: Build Android release APK
        working-directory: android_app
        run: flutter build apk --release

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omalink-release-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android_app/build/app/outputs/flutter-apk/app-release.apk
